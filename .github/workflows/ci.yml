name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
      - name: Install repository-boundary tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Create isolated acceptance database
        run: createdb -h localhost -U postgres lenso_privacy_request_test
      - name: Check repository ownership
        run: ./scripts/check-repository-boundary.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Install exact contract projection checker
        run: cargo install --locked --version '=0.6.5' lenso-contract-codegen
      - name: Check contract projections
        run: lenso-contract-codegen workspace check --manifest-path Cargo.toml
      - name: Test workspace and PostgreSQL acceptance
        env:
          LENSO_PRIVACY_REQUEST_TEST_DATABASE_URL: postgres://postgres@localhost:5432/lenso_privacy_request_test
        run: cargo test --locked --workspace --all-features
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Package public Capability crates
        run: |
          cargo package --locked -p lenso-capability-privacy-request
          cargo package --locked -p lenso-capability-privacy-request-admin
          cargo package --locked -p lenso-capability-privacy-request-worker
